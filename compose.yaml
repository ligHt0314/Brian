services:
  falkordb:
    image: falkordb/falkordb:v4.14.11@sha256:3e3870883d8cc4a20171d59fbafeb7cf29b57c09d71c29287fdacf4fedb8a078
    environment:
      REDIS_ARGS: "--dir /var/lib/falkordb/data --appendonly yes --appendfsync everysec --save 60 1"
    volumes:
      - graph-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:3000}
      SQLITE_PATH: /data/operations.sqlite
      UPLOAD_DIR: /data/originals
    volumes:
      - api-data:/data
    depends_on:
      falkordb:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api
volumes:
  graph-data:
  api-data:
