[project]
name = "company-brain"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.143.2", "uvicorn==0.54.0", "falkordb==1.8.0", "pydantic-settings==2.16.0", "python-multipart==0.0.32", "itsdangerous==2.2.0", "httpx==0.28.1"]
[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1"]
[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["services/api/tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
